<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7f8;color:#171717}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid #eee}
.nav{max-width:1100px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}

.wrap{max-width:1100px;margin:auto;padding:0 18px 40px}
.panel{background:white;border:1px solid #eee;border-radius:20px;padding:22px;box-shadow:0 5px 20px #00000008}
.panel h2{margin:0 0 8px}.panel p{color:#777;margin:0 0 18px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;text-decoration:none;font-weight:800;border-radius:13px;padding:13px 20px;font-size:15px}
.btn.main{background:#f97316;color:#fff}
.btn.alt{background:#171717;color:#fff}
.btn.ghost{background:#eee;color:#171717}
